<head>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Tahoma,sans-serif}
body{background:linear-gradient(160deg,#0a0014,#12004a,#001a4d);color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center}
.s{display:none;width:100%;max-width:600px;padding:24px;text-align:center}.s.on{display:block}

textarea{min-height:70px;font-size:11px;word-break:break-all}
input:focus,textarea:focus{border-color:#a855f7}
#rec,#rInp{letter-spacing:6px;text-transform:uppercase;font-weight:bold}
.btn{width:100%;padding:13px;border:none;border-radius:8px;background:linear-gradient(90deg,#a855f7,#3b82f6);color:#fff;font-weight:bold;font-size:16px;cursor:pointer;margin-top:6px}
.msg{min-height:20px;font-size:14px;margin-top:12px;color:#ff6b6b}
#g{padding-top:200px;position:relative;min-height:100vh}
.bar{position:fixed;top:12px;right:12px;display:flex;gap:8px;align-items:center;z-index:9}
.coin{display:flex;gap:6px;align-items:center;background:#000000bf;padding:6px 14px;border-radius:20px;border:1.5px solid #ffd400;font-weight:bold;font-size:16px}
.coin img{width:28px;height:28px;border-radius:50%;object-fit:cover;border:2px solid #ffd400}.coin .v{color:#ffd400}
.rb{background:linear-gradient(90deg,#a855f7,#3b82f6);border:none;color:#fff;font-weight:bold;font-size:12px;padding:8px 12px;border-radius:20px;cursor:pointer}
.sw{position:relative}
.sb{width:38px;height:38px;border-radius:50%;background:#000000bf;border:1.5px solid #a855f7;color:#c084fc;cursor:pointer;font-size:17px}
.sm{position:absolute;top:46px;left:0;background:#1a0a4a;border:1.5px solid #a855f7;border-radius:12px;padding:8px;min-width:180px;display:none}
.sm.on{display:block}
.sm button{width:100%;padding:12px;background:none;border:none;color:#c084fc;font-size:14px;font-weight:bold;cursor:pointer;border-radius:8px;text-align:right}
.sm button.d{color:#ff8080}
.tb{position:absolute;top:100px;left:14px;right:14px;display:flex;justify-content:flex-end}
.tu{display:flex;flex-direction:column;align-items:center;gap:6px}
.nm{font-size:22px;font-weight:bold;color:#c084fc;order:2;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.sb2{background:none;border:1px solid #3b2a7a;color:#8b8bb5;padding:7px 14px;border-radius:20px;cursor:pointer;font-size:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:20px 0 30px}
.rw{display:flex;flex-direction:column;align-items:center}
.r{width:100%;height:120px;border-radius:14px;cursor:pointer;display:block;background-size:cover;background-position:center}
.r1{background-image:url('https://i.postimg.cc/L5SrwVqN/IMG-20261007-203138-551.jpg')}
.r2{background-image:url('https://i.postimg.cc/fTwGvBQ3/Screenshot-20260924-153817.png')}
.r3{background-image:url('https://i.postimg.cc/jddHcJgC/conversation-chat-sms-icon-vector-design-png-115082.jpg');background-color:#fff}

.nt{margin-top:10px;font-size:12px;color:#8b8bb5}
.nt span{color:#c084fc;font-weight:bold}.ol span{color:#4ade80}
.nt .small{font-size:10px;color:#8b8bb5;font-weight:normal;display:block;margin-top:2px}
.shop{position:fixed;bottom:16px;left:16px;width:58px;height:58px;border-radius:50%;object-fit:cover;border:2.5px solid #a855f7;cursor:pointer;z-index:9;background:#140a32}
.m{position:fixed;inset:0;background:#000000eb;display:none;align-items:center;justify-content:center;z-index:9;padding:20px}
.m.on{display:flex}
.mb{background:#12004a;border:1px solid #a855f7;border-radius:16px;padding:26px 22px;max-width:400px;width:100%;text-align:center;max-height:90vh;overflow-y:auto}
.mb h2{color:#c084fc;font-size:20px;margin-bottom:12px}
.mb p{color:#8b8bb5;font-size:13px;margin-bottom:16px}
.cd{background:#000;border:1px dashed #a855f7;border-radius:10px;padding:14px;font-size:13px;font-weight:bold;margin-bottom:16px;word-break:break-all;user-select:all}
.cb{background:none;border:1px solid #3b82f6;color:#7dabff;padding:10px;border-radius:8px;width:100%;cursor:pointer;font-size:14px;margin-bottom:8px}
.must{color:#ff6b6b;font-size:12px;margin-top:12px}
.cs{display:flex;align-items:center;justify-content:center;gap:12px;padding:14px;background:#00000080;border-radius:12px;border:1px solid #ffd400;margin-top:10px}
.cs img{width:56px;height:56px;border-radius:50%;border:2px solid #ffd400}
.cs .v{font-size:32px;font-weight:bold;color:#ffd400}.cs .l{font-size:12px;color:#8b8bb5}
.ok{font-size:18px;font-weight:bold;color:#4ade80;margin-bottom:6px}
.gm{font-size:15px;color:#ffd400;font-weight:bold;margin-bottom:6px}
.pc{width:100px;height:100px;border-radius:50%;border:2px dashed #3b2a7a;display:inline-flex;align-items:center;justify-content:center;font-size:30px;color:#5a4a88;cursor:pointer;overflow:hidden;background:#140a3280}
.pc img{width:100%;height:100%;object-fit:cover}
#pIn,#apIn{display:none}
.pr{display:flex;gap:8px;margin-bottom:12px}.pr input{flex:1;margin:0}
.pr button{background:none;border:1px solid #3b2a7a;color:#c084fc;width:44px;border-radius:8px;cursor:pointer;font-size:18px}
.as{text-align:right;margin-bottom:14px}
.st{color:#c084fc;font-size:13px;font-weight:bold;margin-bottom:8px}
.sv{color:#4ade80;font-size:13px;min-height:18px;margin-top:6px}
.rtabs{display:flex;gap:6px;margin-bottom:14px}
.rtabs button{flex:1;background:none;border:1px solid #3b2a7a;color:#8b8bb5;padding:9px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:bold}
.rtabs button.on{background:#a855f7;color:#fff;border-color:transparent}
.rp{display:none}.rp.on{display:block}
</style>
</head>
<body>

<div id="a" class="s on">
  <img class="logo" src="https://i.postimg.cc/qvNrntw5/IMG-20261008-204740-452.jpg">
  <h1>TAKST</h1><p class="sub">سجّل دخولك للبدء</p>
  <div class="tabs">
    <button id="tl" class="on" onclick="tab('login')">دخول</button>
    <button id="ts" onclick="tab('signup')">حساب جديد</button>
    <button id="tr" onclick="tab('recover')">استرداد</button>
  </div>
  <input id="u" placeholder="اسم المستخدم">

  <input id="rec" placeholder="الصق رمز الاسترداد" style="display:none">
  <div id="pb" style="display:none;margin-bottom:14px">

    <input type="file" id="pIn" accept="image/*">
  </div>
  <button class="btn" id="mb" onclick="go()">دخول</button>
  <div class="msg" id="m"></div>
</div>

<div id="g" class="s">
  <div class="bar">
    <div class="coin"><img src="https://i.postimg.cc/cHM21qYD/IMG-20261008-153917-222.jpg"><span class="v" id="cc">0</span></div>
    <button class="rb" onclick="openR()">💰 استرداد</button>
    <div class="sw">
      <button class="sb" onclick="tg(event)">⚙️</button>
      <div class="sm" id="sm">
        <button onclick="myCode()">🔑 عرض الرمز</button>
        <button onclick="openA()">👤 معلومات الحساب</button>
        <button onclick="out()" class="d">🚪 تسجيل الخروج</button>
      </div>
    </div>
  </div>
  <div class="tb"><div class="tu"><div class="up" id="up">👤</div><span class="nm" id="wn"></span></div></div>
  <a href="https://hesoyam14moh-dot.github.io/shoop/" target="_blank"><img class="shop" src="https://i.postimg.cc/85Q19mpz/IMG-20261010-091950-214.jpg"></a>
  <div class="row">
    <div class="rw"><a class="r r1" href="https://hesoyam14moh-dot.github.io/monster-game/" target="_blank"></a><p class="nt"><span>👹 لعبة الوحش</span><span class="small">أوف لاين</span></p></div>
    <div class="rw"><a class="r r2" href="https://hesoyam14moh-dot.github.io/sohtar/" target="_blank"></a><p class="nt ol"><span>🌐 أونلاين</span></p></div>
    <div class="rw"><a class="r r3" href="https://hesoyam14moh-dot.github.io/chat/" target="_blank"></a><p class="nt"><span>💬 شات</span></p></div>
    <div class="rw"><a class="r r4" href="https://hesoyam14moh-dot.github.io/parkour/" target="_blank"></a><p class="nt"><span>🏃 باركور</span><span class="small">أونلاين + أوف لاين</span></p></div>
  </div>
</div>

<div id="cm" class="m"><div class="mb">
  <h2>🔑 رمز الاسترداد</h2><p>احفظه في مكان آمن</p>
  <div class="cd" id="ct">----</div>
  <button class="cb" onclick="cp()" id="cpb">📋 نسخ</button>
  <button class="btn" onclick="cnf()" id="cfb">حفظت الرمز ✓</button>
  <p class="must" id="mn">⚠️ إجباري: احفظ الرمز</p>
</div></div>

<div id="rm" class="m"><div class="mb">
  <h2>💰 استرداد</h2>
  <div class="rtabs">
    <button id="r1" class="on" onclick="rtab(1)">💰 عملات</button>
    <button id="r2" onclick="rtab(2)">🎭 الشخصية</button>
  </div>
  <div id="rp1" class="rp on">
    <p>أدخل كود هدية (7 خانات)</p>
    <input id="rInp" placeholder="XXXXXXX" maxlength="7">
    <button class="btn" onclick="subR()">تأكيد</button>
    <div id="rr" style="margin-top:14px"></div>
  </div>
  <div id="rp2" class="rp">
    <p>الصق كود المتجر (يحدّث العملات)</p>
    <textarea id="rInp2" placeholder="الصق كود المتجر هنا..."></textarea>
    <button class="btn" onclick="subC()">تأكيد</button>
    <div id="rr2" style="margin-top:14px"></div>
  </div>
  <button class="sb2" onclick="cls('rm')" style="margin-top:16px">إغلاق</button>
</div></div>

<div id="am" class="m"><div class="mb">
  <h2>👤 معلومات الحساب</h2>
  <div class="as"><div class="st">اسم الحساب</div><input id="au"></div>
  <div class="as"><div class="st">كلمة السر (مشفّرة)</div>
    <div class="pr"><input id="ap" type="password" readonly><button onclick="tp()" id="pe">👁</button></div>
  </div>
  <div class="as"><div class="st">الصورة</div>
    <label for="apIn" class="pc" id="apv" style="display:block">👤</label>
    <input type="file" id="apIn" accept="image/*">
    <input id="au2" placeholder="أو رابط مباشر" style="margin-top:10px;font-size:13px">
    <button class="sb2" onclick="apU()" style="width:100%;margin-top:6px;padding:8px">🔗 تطبيق الرابط</button>
  </div>
  <button class="btn" onclick="svA()">💾 حفظ</button>
  <div class="sv" id="av"></div>
  <button class="sb2" onclick="cls('am')" style="width:100%;margin-top:12px;padding:9px">إغلاق</button>
</div></div>

<script>
var CU='https://i.postimg.cc/cHM21qYD/IMG-20261008-153917-222.jpg';
var GC={HESOYAM:5,MOH6767:5,PPPPPPP:5,HAHAHAH:5,'6767676':10,VONJFTG:.5,BHYGFD:.5,OKATVCD:.5,IMJYCXZ:.5,MOKHSNB:.5,OJKLUGZ:.5,ZUPKMH:.5,WANRNEW:.5,GDHHJKG:.5,HHHHHHH:.5,HIFOVWV:.5,YFOWQMJ:.5,GDHTXHA:.5,AWQMOPA:.5,HMFYBDK:.5,VODMHAA:.5,YFHOLHJ:.5,TDOEMFH:.5};
var mode='login',pend=null,viewing=false,newPic=null,accPic,accUrl,showP=false;
function U(){try{return JSON.parse(localStorage.getItem('tk_u'))||{}}catch(e){return{}}}
function S(u){try{localStorage.setItem('tk_u',JSON.stringify(u));return 1}catch(e){alert('الذاكرة ممتلئة');return 0}}
function C(){return localStorage.getItem('tk_s')}
function $(i){return document.getElementById(i)}
function cmp(f,cb){var r=new FileReader();r.onload=function(e){var i=new Image();i.onload=function(){var c=document.createElement('canvas'),w=i.width,h=i.height,m=250;if(w>h&&w>m){h=h*m/w;w=m}else if(h>m){w=w*m/h;h=m}c.width=w;c.height=h;c.getContext('2d').drawImage(i,0,0,w,h);cb(c.toDataURL('image/jpeg',.7))};i.src=e.target.result};r.readAsDataURL(f)}
function mk(u,c,p,ch){var o={u:u,c:c};if(p&&p.indexOf&&p.indexOf('http')===0)o.p=p;if(ch)o.ch=ch;return btoa(encodeURIComponent(JSON.stringify(o))).replace(/=+$/,'').replace(/\+/g,'-').replace(/\//g,'_')}
function prs(x){try{var b=x.replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';var o=JSON.parse(decodeURIComponent(atob(b)));if(!o||!o.u)return null;return{u:o.u,c:parseFloat(o.c)||0,p:o.p||null,ch:o.ch||null}}catch(e){return null}}

/* ==== يقرأ العملات فقط من كود المتجر ==== */
function readCoins(x){
  try{
    var b=x.replace(/-/g,'+').replace(/_/g,'/');
    while(b.length%4)b+='=';
    var o=JSON.parse(decodeURIComponent(atob(b)));
    var v=o.coins;
    if(v===undefined)v=o.money;
    if(v===undefined)v=o.gold;
    if(v===undefined)v=o.balance;
    if(v===undefined)v=o.c;
    if(v===undefined)v=o.coin;
    if(v===undefined)return null;
    v=parseFloat(v);
    return isNaN(v)?null:v;
  }catch(e){return null}
}

function tab(m){
  mode=m;
  $('tl').classList.toggle('on',m==='login');$('ts').classList.toggle('on',m==='signup');$('tr').classList.toggle('on',m==='recover');
  $('u').style.display=m==='recover'?'none':'block';
  $('p').style.display=m==='recover'?'none':'block';
  $('p2').style.display=m==='signup'?'block':'none';
  $('pb').style.display=m==='signup'?'block':'none';
  $('rec').style.display=m==='recover'?'block':'none';
  $('mb').textContent=m==='signup'?'إنشاء الحساب':m==='recover'?'استرداد':'دخول';
  $('m').textContent='';
}
$('pIn').onchange=function(e){if(!e.target.files[0])return;cmp(e.target.files[0],function(d){newPic=d;$('pvp').innerHTML='<img src="'+d+'">'})};

function go(){
  var u=$('u').value.trim(),p=$('p').value,p2=$('p2').value,rc=$('rec').value.trim(),us=U();
  $('m').textContent='';
  if(mode==='recover'){
    if(!rc)return $('m').textContent='الصق الرمز';
    var q=prs(rc);
    if(!q)return $('m').textContent='الرمز غير صحيح';
    if(us[q.u]){us[q.u].coins=q.c;if(q.p)us[q.u].pic=q.p;if(q.ch)us[q.u].character=q.ch;S(us);in_(q.u)}
    else{us[q.u]={password:'',code:'',pic:q.p||null,coins:q.c,usedCodes:[],character:q.ch||null};S(us);in_(q.u)}
    return;
  }
  if(!u||!p)return $('m').textContent='اكتب الاسم وكلمة السر';
  if(mode==='signup'){
    if(p!==p2)return $('m').textContent='كلمتا السر غير متطابقتين';
    if(us[u])return $('m').textContent='الاسم موجود';
    us[u]={password:p,code:'',pic:newPic||null,coins:0,usedCodes:[],character:null};
    if(!S(us))return;
    pend=u;viewing=false;
    $('ct').textContent=mk(u,0,null,null);
    $('mn').style.display='block';
    $('cfb').textContent='حفظت الرمز ✓';$('cfb').onclick=cnf;
    $('cm').classList.add('on');
  }else{
    if(!us[u])return $('m').textContent='الاسم غير موجود';
    if(us[u].password!==p)return $('m').textContent='كلمة السر غلط';
    in_(u);
  }
}
function cp(){var t=$('ct').textContent,d=function(){$('cpb').textContent='✅ تم';setTimeout(function(){$('cpb').textContent='📋 نسخ'},1500)};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(d).catch(function(){fb(t,d)});else fb(t,d)}
function fb(t,cb){var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.focus();a.select();try{document.execCommand('copy');cb()}catch(e){}document.body.removeChild(a)}
function cnf(){$('cm').classList.remove('on');if(!viewing&&pend){in_(pend);pend=null}}
function myCode(){var u=C(),us=U();if(!u||!us[u])return;viewing=true;$('ct').textContent=mk(u,us[u].coins||0,us[u].pic,us[u].character);$('mn').style.display='none';$('cfb').textContent='إغلاق';$('cfb').onclick=function(){$('cm').classList.remove('on')};$('cm').classList.add('on')}
function openR(){$('rInp').value='';$('rr').innerHTML='';$('rInp2').value='';$('rr2').innerHTML='';rtab(1);$('rm').classList.add('on')}
function cls(id){$(id).classList.remove('on')}
function rtab(n){$('r1').classList.toggle('on',n===1);$('r2').classList.toggle('on',n===2);$('rp1').classList.toggle('on',n===1);$('rp2').classList.toggle('on',n===2)}
function subR(){var u=C(),us=U(),i=$('rInp').value.trim().toUpperCase();if(!u||!us[u]||!i)return;if(GC[i]!==undefined){us[u].usedCodes=us[u].usedCodes||[];if(us[u].usedCodes.indexOf(i)!==-1)return $('rr').innerHTML='<div style="color:#ff6b6b">⚠️ استخدمت هذا الكود</div>';us[u].coins=(us[u].coins||0)+GC[i];us[u].usedCodes.push(i);S(us);upC();$('rr').innerHTML='<div class="ok">🎉 مبروك!</div><div class="gm">حصلت على '+GC[i]+' عملة</div><div class="cs"><img src="'+CU+'"><div style="text-align:right"><div class="v">'+us[u].coins+'</div><div class="l">مجموع عملاتك</div></div></div>';return}$('rr').innerHTML='<div style="color:#ff6b6b">❌ الكود غير صحيح</div>'}

/* ==== استرداد الشخصية: يقرأ العملات فقط ==== */
function subC(){
  var u=C(),us=U(),i=$('rInp2').value.trim();
  if(!u||!us[u])return $('rr2').innerHTML='<div style="color:#ff6b6b">سجّل دخول أولاً</div>';
  if(!i)return $('rr2').innerHTML='<div style="color:#ff6b6b">الصق كود المتجر</div>';
  var c=readCoins(i);
  if(c===null)return $('rr2').innerHTML='<div style="color:#ff6b6b">❌ الكود ما فيه عملات</div>';
  us[u].coins=c;
  S(us);upC();
  $('rr2').innerHTML='<div class="ok">✅ تم التحديث</div><div class="cs"><img src="'+CU+'"><div style="text-align:right"><div class="v">'+c+'</div><div class="l">عملاتك الآن</div></div></div>';
}

function upC(){var u=C(),us=U();$('cc').textContent=(u&&us[u]&&us[u].coins)||0}
function in_(u){localStorage.setItem('tk_s',u);var d=U()[u]||{};$('wn').textContent=u;$('up').innerHTML=d.pic?'<img src="'+d.pic+'">':'👤';upC();$('a').classList.remove('on');$('g').classList.add('on');$('rec').value='';$('pvp').innerHTML='👤';newPic=null;$('m').textContent=''}
