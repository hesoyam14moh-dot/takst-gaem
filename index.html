<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TAKST</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Tahoma,sans-serif}
body{background:linear-gradient(160deg,#0a0014,#12004a,#001a4d);color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center}
.s{display:none;width:100%;max-width:600px;padding:24px;text-align:center}
.s.on{display:block}
.logo{height:160px;margin:0 auto 14px;display:block}
h1{font-size:30px;letter-spacing:3px;margin-bottom:6px;background:linear-gradient(90deg,#a855f7,#3b82f6);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-weight:800}
.sub{color:#8b8bb5;font-size:14px;margin-bottom:22px}
.tabs{display:flex;margin-bottom:18px;border-bottom:1px solid #2a1a5e}
.tabs button{flex:1;background:none;border:none;color:#7a6aa8;padding:10px;font-size:14px;cursor:pointer;border-bottom:2px solid transparent}
.tabs button.on{color:#c084fc;border-bottom-color:#a855f7}
input{width:100%;padding:12px;margin-bottom:12px;background:#140a32cc;border:1px solid #2a1a5e;border-radius:8px;color:#fff;font-size:15px;outline:none;text-align:center}
input:focus{border-color:#a855f7}
input::placeholder{color:#5a4a88}
#rec,#rInp{letter-spacing:6px;text-transform:uppercase;font-weight:bold}
.btn{width:100%;padding:13px;border:none;border-radius:8px;background:linear-gradient(90deg,#a855f7,#3b82f6);color:#fff;font-weight:bold;font-size:16px;cursor:pointer;margin-top:6px}
.msg{min-height:20px;font-size:14px;margin-top:12px;color:#ff6b6b}
#g{padding-top:200px;position:relative}
.top-bar{position:fixed;top:12px;right:12px;display:flex;gap:8px;align-items:center;z-index:9}
.coin{display:flex;gap:6px;align-items:center;background:#000000bf;padding:6px 14px;border-radius:20px;border:1.5px solid #ffd400;font-weight:bold;font-size:16px}
.coin img{width:28px;height:28px;border-radius:50%;object-fit:cover;border:2px solid #ffd400}
.coin .v{color:#ffd400}
.rb{background:linear-gradient(90deg,#a855f7,#3b82f6);border:none;color:#fff;font-weight:bold;font-size:12px;padding:8px 12px;border-radius:20px;cursor:pointer}
.sw{position:relative}
.sb{width:38px;height:38px;border-radius:50%;background:#000000bf;border:1.5px solid #a855f7;color:#c084fc;cursor:pointer;font-size:17px}
.sm{position:absolute;top:46px;left:0;background:linear-gradient(160deg,#1a0a4a,#0a0014);border:1.5px solid #a855f7;border-radius:12px;padding:8px;min-width:180px;display:none}
.sm.on{display:block}
.sm button{width:100%;padding:12px;background:none;border:none;color:#c084fc;font-size:14px;font-weight:bold;cursor:pointer;border-radius:8px;text-align:right}
.sm button.d{color:#ff8080}
.tb{position:absolute;top:100px;left:14px;right:14px;display:flex;justify-content:flex-end}
.tu{display:flex;flex-direction:column;align-items:center;gap:6px}
.nm{font-size:22px;font-weight:bold;color:#c084fc;order:2;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.up{width:90px;height:90px;border-radius:50%;border:2px solid #a855f7;background:#140a32e6;display:flex;align-items:center;justify-content:center;font-size:38px;overflow:hidden;order:1}
.up img{width:100%;height:100%;object-fit:cover}
.sb2{background:none;border:1px solid #3b2a7a;color:#8b8bb5;padding:7px 14px;border-radius:20px;cursor:pointer;font-size:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:20px 0 30px}
.rw{display:flex;flex-direction:column;align-items:center}
.r{width:100%;height:120px;border-radius:14px;cursor:pointer;display:block;background-size:cover;background-position:center;transition:.2s}
.r:hover{transform:translateY(-4px)}
.r.r1{background-image:url('https://i.postimg.cc/L5SrwVqN/IMG-20261007-203138-551.jpg')}
.r.r2{background-image:url('https://i.postimg.cc/fTwGvBQ3/Screenshot-20260924-153817.png')}
.r.r3{background-image:url('https://i.postimg.cc/jddHcJgC/conversation-chat-sms-icon-vector-design-png-115082.jpg');background-color:#fff}
.r.r4{background-image:url('https://i.postimg.cc/bYSS5zxd/IMG-20261008-155731-897.jpg')}
.nt{margin-top:10px;font-size:12px;color:#8b8bb5}
.nt span{color:#c084fc;font-weight:bold}
.nt ol span{color:#4ade80}
.m{position:fixed;inset:0;background:#000000eb;display:none;align-items:center;justify-content:center;z-index:9;padding:20px}
.m.on{display:flex}
.mb{background:linear-gradient(160deg,#12004a,#0a0014);border:1px solid #a855f7;border-radius:16px;padding:26px 22px;max-width:400px;width:100%;text-align:center;max-height:90vh;overflow-y:auto}
.mb h2{color:#c084fc;font-size:20px;margin-bottom:12px}
.mb p{color:#8b8bb5;font-size:13px;margin-bottom:16px}
.cd{background:#000;border:1px dashed #a855f7;border-radius:10px;padding:14px;font-size:13px;font-weight:bold;margin-bottom:16px;word-break:break-all;line-height:1.4}
.cb{background:none;border:1px solid #3b82f6;color:#7dabff;padding:10px;border-radius:8px;width:100%;cursor:pointer;font-size:14px;margin-bottom:8px}
.must{color:#ff6b6b;font-size:12px;margin-top:12px}
.cs{display:flex;align-items:center;justify-content:center;gap:12px;padding:14px;background:#00000080;border-radius:12px;border:1px solid #ffd400;margin-top:10px}
.cs img{width:56px;height:56px;border-radius:50%;border:2px solid #ffd400}
.cs .v{font-size:32px;font-weight:bold;color:#ffd400}
.cs .l{font-size:12px;color:#8b8bb5}
.ok{font-size:18px;font-weight:bold;color:#4ade80;margin-bottom:6px}
.gm{font-size:15px;color:#ffd400;font-weight:bold;margin-bottom:6px}
.pc{width:100px;height:100px;border-radius:50%;border:2px dashed #3b2a7a;display:inline-flex;align-items:center;justify-content:center;font-size:30px;color:#5a4a88;cursor:pointer;overflow:hidden;background:#140a3280}
.pc img{width:100%;height:100%;object-fit:cover}
#pIn,#apIn{display:none}
.pr{display:flex;gap:8px;margin-bottom:12px}
.pr input{flex:1;margin:0}
.pr button{background:none;border:1px solid #3b2a7a;color:#c084fc;width:44px;border-radius:8px;cursor:pointer;font-size:18px}
.as{text-align:right;margin-bottom:14px}
.st{color:#c084fc;font-size:13px;font-weight:bold;margin-bottom:8px}
.sv{color:#4ade80;font-size:13px;min-height:18px;margin-top:6px}
</style>
</head>
<body>

<div id="a" class="s on">
  <img class="logo" src="https://i.postimg.cc/qvNrntw5/IMG-20261008-204740-452.jpg">
  <h1>TAKST</h1><p class="sub">سجّل دخولك للبدء</p>
  <div class="tabs">
    <button id="tl" class="on" onclick="tab('login')">دخول</button>
    <button id="ts" onclick="tab('signup')">حساب جديد</button>
    <button id="tr" onclick="tab('recover')">استرداد</button>
  </div>
  <input id="u" placeholder="اسم المستخدم">
  <input id="p" type="password" placeholder="كلمة السر">
  <input id="p2" type="password" placeholder="تأكيد كلمة السر" style="display:none">
  <input id="rec" placeholder="الصق رمز الاسترداد" style="display:none">
  <div id="pb" style="display:none;margin-bottom:14px">
    <label for="pIn" class="pc" id="pvp">👤</label>
    <span style="display:block;font-size:12px;color:#7a6aa8;margin-top:6px">أضف صورة (اختياري)</span>
    <input type="file" id="pIn" accept="image/*">
  </div>
  <button class="btn" id="mb" onclick="go()">دخول</button>
  <div class="msg" id="m"></div>
</div>

<div id="g" class="s">
  <div class="top-bar">
    <div class="coin"><img src="https://i.postimg.cc/cHM21qYD/IMG-20261008-153917-222.jpg"><span class="v" id="cc">0</span></div>
    <button class="rb" onclick="openR()">💰 استرداد</button>
    <div class="sw">
      <button class="sb" onclick="tg(event)">⚙️</button>
      <div class="sm" id="sm">
        <button onclick="myCode()">🔑 عرض الرمز</button>
        <button onclick="openA()">👤 معلومات الحساب</button>
        <button onclick="out()" class="d">🚪 تسجيل الخروج</button>
      </div>
    </div>
  </div>
  <div class="tb"><div class="tu"><div class="up" id="up">👤</div><span class="nm" id="wn"></span></div></div>
  <div class="row">
    <div class="rw"><a class="r r1" href="https://hesoyam14moh-dot.github.io/moh67/" target="_blank"></a><p class="nt">🎮 <span>لعبة فردية</span><br>غير أونلاين</p></div>
    <div class="rw"><a class="r r2" href="https://hesoyam14moh-dot.github.io/sohtar/" target="_blank"></a><p class="nt ol">🌐 <span>أونلاين</span></p></div>
    <div class="rw"><a class="r r3" href="https://hesoyam14moh-dot.github.io/chat/" target="_blank"></a><p class="nt">💬 شات</p></div>
    <div class="rw"><a class="r r4" href="https://hesoyam14moh-dot.github.io/parkour/" target="_blank"></a><p class="nt">🏃 باركور</p></div>
  </div>
</div>

<div id="cm" class="m">
  <div class="mb">
    <h2>🔑 رمز الاسترداد</h2>
    <p>احفظ هذا الرمز في مكان آمن</p>
    <div class="cd" id="ct">----</div>
    <button class="cb" onclick="cp()" id="cpb">📋 نسخ</button>
    <button class="btn" onclick="cnf()" id="cfb">حفظت الرمز ✓</button>
    <p class="must" id="mn">⚠️ إجباري: احفظ الرمز</p>
  </div>
</div>

<div id="rm" class="m">
  <div class="mb">
    <h2>💰 استرداد العملات</h2>
    <p>أدخل كود هدية (7 خانات)</p>
    <input id="rInp" placeholder="XXXXXXX" maxlength="7">
    <button class="btn" onclick="subR()">تأكيد</button>
    <div id="rr" style="margin-top:14px"></div>
    <button class="sb2" onclick="cls('rm')" style="margin-top:16px">إغلاق</button>
  </div>
</div>

<div id="am" class="m">
  <div class="mb">
    <h2>👤 معلومات الحساب</h2>
    <div class="as"><div class="st">اسم الحساب</div><input id="au"></div>
    <div class="as"><div class="st">كلمة السر (مشفّرة)</div>
      <div class="pr"><input id="ap" type="password" readonly><button onclick="tp()" id="pe">👁</button></div>
    </div>
    <div class="as"><div class="st">صورة الحساب</div>
      <label for="apIn" class="pc" id="apv" style="display:block">👤</label>
      <input type="file" id="apIn" accept="image/*">
      <input id="au2" placeholder="أو رابط مباشر (ينتقل مع الرمز)" style="margin-top:10px;font-size:13px">
      <button class="sb2" onclick="apU()" style="width:100%;margin-top:6px;padding:8px">🔗 تطبيق الرابط</button>
    </div>
    <button class="btn" onclick="svA()">💾 حفظ</button>
    <div class="sv" id="av"></div>
    <button class="sb2" onclick="cls('am')" style="width:100%;margin-top:12px;padding:9px">إغلاق</button>
  </div>
</div>

<script>
const CU='https://i.postimg.cc/cHM21qYD/IMG-20261008-153917-222.jpg';
const GC={'HESOYAM':5,'MOH6767':5,'PPPPPPP':5,'HAHAHAH':5,'6767676':10,'VONJFTG':.5,'BHYGFD':.5,'OKATVCD':.5,'IMJYCXZ':.5,'MOKHSNB':.5,'OJKLUGZ':.5,'ZUPKMH':.5,'WANRNEW':.5,'GDHHJKG':.5,'HHHHHHH':.5,'HIFOVWV':.5,'YFOWQMJ':.5,'GDHTXHA':.5,'AWQMOPA':.5,'HMFYBDK':.5,'VODMHAA':.5,'YFHOLHJ':.5,'TDOEMFH':.5};
let mode='login',pend=null,viewing=false,newPic=null,accPic,accUrl,showP=false;
const U=()=>{try{return JSON.parse(localStorage.getItem('tk_u'))||{}}catch(e){return{}}};
const S=u=>{try{localStorage.setItem('tk_u',JSON.stringify(u));return 1}catch(e){alert('الذاكرة ممتلئة');return 0}};
const C=()=>localStorage.getItem('tk_s');
const $=id=>document.getElementById(id);

function cmp(f,cb){const r=new FileReader();r.onload=e=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');let w=i.width,h=i.height,m=250;if(w>h&&w>m){h=h*m/w;w=m}else if(h>m){w=w*m/h;h=m}c.width=w;c.height=h;c.getContext('2d').drawImage(i,0,0,w,h);cb(c.toDataURL('image/jpeg',.75))};i.src=e.target.result};r.readAsDataURL(f)}

function mk(u,c,p){try{let r=encodeURIComponent(u)+'|'+c;if(p&&p.indexOf('http')===0)r+='|'+encodeURIComponent(p);return btoa(r).replace(/=+$/,'').replace(/\+/g,'-').replace(/\//g,'_')}catch(e){return''}}
function prs(c){try{let b=c.replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';const r=atob(b).split('|');if(r.length<2)return null;return{u:decodeURIComponent(r[0]),c:parseFloat(r[1])||0,p:r[2]?decodeURIComponent(r[2]):null}}catch(e){return null}}

function tab(m){mode=m;$('tl').classList.toggle('on',m==='login');$('ts').classList.toggle('on',m==='signup');$('tr').classList.toggle('on',m==='recover');$('u').style.display=m==='recover'?'none':'block';$('p').style.display=m==='recover'?'none':'block';$('p2').style.display=m==='signup'?'block':'none';$('pb').style.display=m==='signup'?'block':'none';$('rec').style.display=m==='recover'?'block':'none';$('mb').textContent=m==='signup'?'إنشاء الحساب':m==='recover'?'استرداد':'دخول';$('m').textContent=''}

$('pIn').onchange=e=>{if(!e.target.files[0])return;cmp(e.target.files[0],d=>{newPic=d;$('pvp').innerHTML='<img src="'+d+'">'})};

function go(){
  const u=$('u').value.trim(),p=$('p').value,p2=$('p2').value,rc=$('rec').value.trim(),us=U();
  $('m').textContent='';
  if(mode==='recover'){
    if(!rc)return $('m').textContent='الصق الرمز';
    const q=prs(rc);
    if(!q)return $('m').textContent='الرمز غير صحيح';
    if(us[q.u]){us[q.u].coins=q.c;if(q.p)us[q.u].pic=q.p;S(us);in_(q.u)}
    else{us[q.u]={password:'',code:'',pic:q.p||null,coins:q.c,usedCodes:[]};S(us);in_(q.u)}
    return
  }
  if(!u||!p)return $('m').textContent='اكتب الاسم وكلمة السر';
  if(mode==='signup'){
    if(p!==p2)return $('m').textContent='كلمتا السر غير متطابقتين';
    if(us[u])return $('m').textContent='الاسم موجود';
    us[u]={password:p,code:'',pic:newPic||null,coins:0,usedCodes:[]};
    if(!S(us))return;
    pend=u;viewing=false;
    $('ct').textContent=mk(u,0,null);
    $('mn').style.display='block';
    $('cfb').textContent='حفظت الرمز ✓';
    $('cfb').onclick=cnf;
    $('cm').classList.add('on');
  }else{
    if(!us[u])return $('m').textContent='الاسم غير موجود';
    if(us[u].password!==p)return $('m').textContent='كلمة السر غلط';
    in_(u)
  }
}

function cp(){navigator.clipboard.writeText($('ct').textContent);$('cpb').textContent='✅';setTimeout(()=>$('cpb').textContent='📋 نسخ',1500)}
function cnf(){$('cm').classList.remove('on');if(!viewing&&pend){in_(pend);pend=null}}

function myCode(){
  const u=C(),us=U();if(!u||!us[u])return;
  viewing=true;
  $('ct').textContent=mk(u,us[u].coins||0,us[u].pic);
  $('mn').style.display='none';
  $('cfb').textContent='إغلاق';
  $('cfb').onclick=()=>$('cm').classList.remove('on');
  $('cm').classList.add('on');
}

function openR(){$('rInp').value='';$('rr').innerHTML='';$('rm').classList.add('on')}
function cls(id){$(id).classList.remove('on')}

function subR(){
  const u=C(),us=U(),i=$('rInp').value.trim().toUpperCase();
  if(!u||!us[u]||!i)return;
  if(GC[i]!==undefined){
    us[u].usedCodes=us[u].usedCodes||[];
    if(us[u].usedCodes.indexOf(i)!==-1)return $('rr').innerHTML='<div style="color:#ff6b6b">⚠️ استخدمت هذا الكود</div>';
    us[u].coins=(us[u].coins||0)+GC[i];
    us[u].usedCodes.push(i);
    S(us);upC();
    $('rr').innerHTML='<div class="ok">🎉 مبروك!</div><div class="gm">حصلت على '+GC[i]+' عملة</div><div class="cs"><img src="'+CU+'"><div style="text-align:right"><div class="v">'+us[u].coins+'</div><div class="l">مجموع عملاتك</div></div></div>';
    return
  }
  $('rr').innerHTML='<div style="color:#ff6b6b">❌ الكود غير صحيح</div>';
}

function upC(){const u=C(),us=U();$('cc').textContent=(u&&us[u]&&us[u].coins)||0}

function in_(u){
  localStorage.setItem('tk_s',u);
  const us=U(),d=us[u]||{};
  $('wn').textContent=u;
  $('up').innerHTML=d.pic?'<img src="'+d.pic+'">':'👤';
  upC();
  $('a').classList.remove('on');$('g').classList.add('on');
  $('rec').value='';$('pvp').innerHTML='👤';newPic=null;$('m').textContent='';
}

function tg(e){e.stopPropagation();$('sm').classList.toggle('on')}
document.addEventListener('click',e=>{if(!e.target.closest('.sw'))$('sm').classList.remove('on')});

function openA(){
  const u=C(),us=U();if(!u||!us[u])return;
  accPic=undefined;accUrl=undefined;showP=false;
  $('sm').classList.remove('on');
  $('au').value=u;
  $('ap').value=us[u].password?btoa(encodeURIComponent(us[u].password)):'—';
  $('ap').type='password';$('pe').textContent='👁';
  $('apv').innerHTML=us[u].pic?'<img src="'+us[u].pic+'">':'👤';
  $('au2').value='';$('av').textContent='';
  $('am').classList.add('on');
}

function tp(){showP=!showP;$('ap').type=showP?'text':'password';$('pe').textContent=showP?'🙈':'👁'}

$('apIn').onchange=e=>{if(!e.target.files[0])return;cmp(e.target.files[0],d=>{accPic=d;accUrl=undefined;$('apv').innerHTML='<img src="'+d+'">'})};

function apU(){const v=$('au2').value.trim();if(!v)return;accUrl=v;accPic=undefined;$('apv').innerHTML='<img src="'+v+'">'}

function svA(){
  const u=C(),us=U();if(!u||!us[u])return;
  const nn=$('au').value.trim();
  if(!nn)return $('av').textContent='⚠️ اكتب اسم';
  if(nn!==u&&us[nn])return $('av').textContent='⚠️ الاسم محجوز';
  if(accPic!==undefined)us[u].pic=accPic;
  if(accUrl!==undefined)us[u].pic=accUrl;
  let fn=u;
  if(nn!==u){us[nn]={...us[u]};delete us[u];localStorage.setItem('tk_s',nn);$('wn').textContent=nn;fn=nn}
  if(!S(us))return;
  $('up').innerHTML=us[fn].pic?'<img src="'+us[fn].pic+'">':'👤';
  $('av').textContent='✅ تم الحفظ';
  setTimeout(()=>cls('am'),800);
}

function out(){
  localStorage.removeItem('tk_s');
  $('sm').classList.remove('on');
  $('g').classList.remove('on');$('a').classList.add('on');
  $('u').value='';$('p').value='';$('p2').value='';$('rec').value='';
  tab('login');
}

window.onload=()=>{const s=C();if(s&&U()[s])in_(s)};
</script>
</body>
</html>
